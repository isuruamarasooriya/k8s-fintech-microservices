apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fintech-microservices-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/isuruamarasooriya/k8s-fintech-microservices.git'
    targetRevision: main
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true