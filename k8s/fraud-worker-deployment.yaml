apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-worker
  labels:
    app: fraud-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-worker
  template:
    metadata:
      labels:
        app: fraud-worker
    spec:
      containers:
      - name: fraud-worker
        image: 802104113126.dkr.ecr.ap-south-1.amazonaws.com/fraud-worker:5f7c5e6d41a970d0fe306cf5967fa04aece1d09c
        env:
        - name: AWS_REGION
          value: "ap-south-1"
        resources:
          limits:
            cpu: "100m"
            memory: "128Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"