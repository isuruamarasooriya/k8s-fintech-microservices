apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-api
  labels:
    app: ingestion-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingestion-api
  template:
    metadata:
      labels:
        app: ingestion-api
    spec:
      containers:
      - name: ingestion-api
        image: <your-aws-ecr-repo-url>/ingestion-api:latest
        ports:
        - containerPort: 5001
        env:
        - name: PORT
          value: "5001"
        - name: AWS_REGION
          value: "ap-south-1"
        resources:
          limits:
            cpu: "100m"
            memory: "128Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"