version: '3.8'

services:
  dynamodb-local:
    image: amazon/dynamodb-local
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"

  ingestion-api:
    build: ./ingestion-api
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - AWS_REGION=ap-south-1
      - AWS_ACCESS_KEY_ID=DUMMYIDEXAMPLE    
      - AWS_SECRET_ACCESS_KEY=DUMMYEXAMPLEKEY
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
    depends_on:
      - dynamodb-local

  fraud-worker:
    build: ./fraud-worker
    environment:
      - AWS_REGION=ap-south-1
      - AWS_ACCESS_KEY_ID=DUMMYIDEXAMPLE
      - AWS_SECRET_ACCESS_KEY=DUMMYEXAMPLEKEY
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
    depends_on:
      - dynamodb-local

  simulator:
    build: ./simulator
    environment:
      - API_URL=http://ingestion-api:5000/api/transactions
    depends_on:
      - ingestion-api

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=http://localhost:5001
    ports:
      - "3000:80"
    depends_on:
      - ingestion-api